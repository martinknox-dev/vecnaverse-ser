[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Martin Knox", email = "kailashnarmatha@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "librosa>=1.0.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sherpa-onnx>=2.0.0",
    "soundfile>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
